name: Update Indices (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-insumos:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (local artifacts only)
        run: |
          python fetch_and_forecast_indices_to_gsheet.py \
            --no-gsheet \
            --output-dir outputs/latest \
            --log-level INFO

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: outputs-latest
          path: outputs/latest/
          if-no-files-found: error
