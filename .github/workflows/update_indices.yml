name: Actualizar datos y proyecciones

on:
  schedule:
    # 11:00 UTC = 06:00 America/Guayaquil
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: indices-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install polars pyarrow yfinance gspread gspread-dataframe pandas google-auth pmdarima numpy

      # Prepara credenciales de Google de forma robusta (sin evaluar el secreto directo en el if)
      - name: Prepare Google credentials
        shell: bash
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SA_B64:  ${{ secrets.GCP_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "${SA_JSON:-}" ]]; then
            # JSON crudo en el secreto
            printf '%s' "${SA_JSON}" > creds.json
          elif [[ -n "${SA_B64:-}" ]]; then
            # JSON en Base64 en el secreto
            printf '%s' "${SA_B64}" | base64 -d > creds.json
          else
            echo "Falta definir GOOGLE_SERVICE_ACCOUNT_JSON (JSON crudo) o GCP_SERVICE_ACCOUNT_JSON_B64 (Base64)." >&2
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/creds.json" >> "$GITHUB_ENV"

      # Sanity check: escribe una marca en la hoja "indices" para validar permisos y API
      - name: Sanity check · write A1 on "indices"
        env:
          SHEET_ID: 1UQCSPaCtBA_v8aTU1xL6W4xtDOl8PpaP-240gJtLn-0
        run: |
          python - << 'PY'
          import os, sys, gspread
          from google.oauth2.service_account import Credentials
          sheet_id = os.environ["SHEET_ID"]
          creds_path = os.environ.get("GOOGLE_APPLICATION_CREDENTIALS", "")
          if not creds_path or not os.path.exists(creds_path):
              sys.stderr.write("No se encontró GOOGLE_APPLICATION_CREDENTIALS\n")
              sys.exit(1)
          scopes = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = Credentials.from_service_account_file(creds_path, scopes=scopes)
          gc = gspread.authorize(creds)
          sh = gc.open_by_key(sheet_id)
          try:
              ws = sh.worksheet("indices")
          except gspread.WorksheetNotFound:
              ws = sh.add_worksheet(title="indices", rows=50, cols=10)
          ws.update_acell("A1", "BOL")
          ws.update_acell("B1", "marca de diagnóstico")
          print("OK: se escribió en A1:B1 de la hoja 'indices'")
          PY

      - name: Run pipeline (fetch + forecast)
        run: |
          set -euo pipefail
          python fetch_and_forecast_indices_to_gsheet.py
