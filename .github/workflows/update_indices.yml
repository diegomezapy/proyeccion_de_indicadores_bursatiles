name: Actualizar datos y proyecciones

on:
  schedule:
    # 11:00 UTC = 06:00 America/Guayaquil
    - cron: "0 11 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Asegúrate de crear este secret con el JSON CRUDO del service account
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      # Alternativa si prefieres base64:
      # GCP_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON_B64 }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "polars>=1.5.0" pyarrow pandas numpy yfinance gspread gspread-dataframe google-auth "statsmodels>=0.13"

      - name: Run pipeline (fetch + forecast)
        run: |
          python fetch_and_forecast_indices_to_gsheet.py
